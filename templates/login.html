<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Academia Horizonte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-login">
    <main class="login-contenedor">
        <section class="login-tarjeta">
            <h1>Academia Horizonte</h1>
            <p class="subtitulo-login">Acceso con correo y contrasena</p>

            {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                <p class="mensaje {{ categoria }}">{{ mensaje }}</p>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}" class="login-formulario" novalidate>
                <label for="correo">Correo</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    required
                    maxlength="120"
                    placeholder="usuario@dominio.com"
                    autocomplete="username"
                >

                <label for="contrasena">Contrasena</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    required
                    minlength="8"
                    maxlength="64"
                    pattern="[A-Za-z0-9]{8,}"
                    title="Usa solo letras y numeros, minimo 8 caracteres"
                    placeholder="Minimo 8, solo alfanumerica"
                    autocomplete="current-password"
                >

                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>
</body>
</html>
